name: Desktop App Release (Windows & Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: linux
          - platform: windows-latest
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux Tauri & AppImage dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file

      - name: Install npm dependencies & build standalone Next.js app
        run: |
          npm ci
          npm run build
          node scripts/prepare-desktop-bundle.mjs

      - name: Build Linux installers (AppImage & deb)
        if: matrix.name == 'linux'
        run: |
          npx --yes @tauri-apps/cli@2 build --config desktop/tauri.conf.json --bundles appimage,deb
          mkdir -p dist-release/AnyStl-linux-x64
          cp desktop/target/release/anystl dist-release/AnyStl-linux-x64/
          cp -r desktop/resources dist-release/AnyStl-linux-x64/resources
          tar -czf dist-release/AnyStl-linux-x64-portable.tar.gz -C dist-release AnyStl-linux-x64
          cp desktop/target/release/bundle/appimage/*.AppImage dist-release/ 2>/dev/null || true
          cp desktop/target/release/bundle/deb/*.deb dist-release/ 2>/dev/null || true
          ls -lh dist-release/

      - name: Build Windows installer (NSIS .exe & portable zip)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2 build --config desktop/tauri.conf.json --bundles nsis
          New-Item -ItemType Directory -Path dist-release\AnyStl-windows-x64 -Force | Out-Null
          Copy-Item desktop\target\release\anystl.exe dist-release\AnyStl-windows-x64\AnyStl.exe
          Copy-Item desktop\resources dist-release\AnyStl-windows-x64\resources -Recurse
          Compress-Archive -Path dist-release\AnyStl-windows-x64\* -DestinationPath dist-release\AnyStl-windows-x64-portable.zip -Force
          Get-ChildItem desktop\target\release\bundle\nsis\*.exe | Copy-Item -Destination dist-release\
          Get-ChildItem dist-release\

      - name: Upload Linux release artifacts
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: AnyStl-linux-x64
          path: |
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/AnyStl-linux-x64-portable.tar.gz

      - name: Upload Windows release artifacts
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: AnyStl-windows-x64
          path: |
            dist-release/*.exe
            dist-release/AnyStl-windows-x64-portable.zip

  publish-release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*.exe
            release-files/*.zip
            release-files/*.AppImage
            release-files/*.deb
            release-files/*.tar.gz
